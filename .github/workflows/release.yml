name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Environment flavor to build'
        required: true
        default: 'prod'
        type: choice
        options:
          - staging
          - prod

jobs:
  release:
    name: Build Release Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Release AAB
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'prod' }}
        run: |
          CAPITALIZED="$(tr '[:lower:]' '[:upper:]' <<< ${FLAVOR:0:1})${FLAVOR:1}"
          gradle ":app:bundle${CAPITALIZED}Release"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuchbhi-release-bundle
          path: app/build/outputs/bundle/**/*.aab
